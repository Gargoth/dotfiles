# ===PLUGINS===
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'

# ===OPTIONS===
# Prevent clipboard permission modal from appearing
set -s set-clipboard on

set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g status-bg green

# set -g mouse on

# Prefer Fish from PATH, then check common Linux, Intel Mac, and Apple Silicon
# locations. Keep the default-command empty except on macOS when the namespace
# wrapper is available; this prevents tmux-sensible from substituting $SHELL.
run-shell 'fish_path=$(command -v fish 2>/dev/null)
case "$fish_path" in /*) ;; *) fish_path= ;; esac
for candidate in /usr/bin/fish /usr/local/bin/fish /opt/homebrew/bin/fish /opt/local/bin/fish; do
    if [ -z "$fish_path" ] && [ -x "$candidate" ]; then fish_path=$candidate; fi
done
if [ -n "$fish_path" ]; then
    tmux_path=$(command -v tmux 2>/dev/null)
    case "$tmux_path" in /*) ;; *) tmux_path= ;; esac
    for candidate in /usr/bin/tmux /usr/local/bin/tmux /opt/homebrew/bin/tmux /opt/local/bin/tmux; do
        if [ -z "$tmux_path" ] && [ -x "$candidate" ]; then tmux_path=$candidate; fi
    done
    if [ -n "$tmux_path" ]; then
        "$tmux_path" set-option -g default-shell "$fish_path"
        "$tmux_path" set-option -g default-command ""
        if [ "$(uname -s 2>/dev/null)" = Darwin ]; then
            reattach_path=$(command -v reattach-to-user-namespace 2>/dev/null)
            case "$reattach_path" in /*) ;; *) reattach_path= ;; esac
            for candidate in /usr/local/bin/reattach-to-user-namespace /opt/homebrew/bin/reattach-to-user-namespace /opt/local/bin/reattach-to-user-namespace; do
                if [ -z "$reattach_path" ] && [ -x "$candidate" ]; then reattach_path=$candidate; fi
            done
            if [ -n "$reattach_path" ]; then
                "$tmux_path" set-option -g default-command "\"$reattach_path\" -l \"$fish_path\""
            fi
        fi
    fi
fi'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
